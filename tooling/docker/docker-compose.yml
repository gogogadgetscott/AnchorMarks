services:
  anchormarks:
    build:
      context: ../..
      dockerfile: ./tooling/docker/Dockerfile
      target: production
      args:
        NODE_ENV: ${NODE_ENV:-production}
        PORT: ${PORT:-3000}
        HOST: ${HOST:-0.0.0.0}
        DB_PATH: ${DB_PATH:-/apps/database/anchormarks.db}
        CORS_ORIGIN: ${CORS_ORIGIN}
        SSL_ENABLED: ${SSL_ENABLED}
        SSL_KEY: ${SSL_KEY}
        SSL_CERT: ${SSL_CERT}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
      DB_PATH: ${DB_PATH:-/apps/database/anchormarks.db}
      # No defaults for production secrets; app will fail at startup if unset (validateSecurityConfig)
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    container_name: anchormarks
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    networks:
      - npm-network
    volumes:
      - ../../apps/database:/apps/database
      - ../../apps/ssl:/apps/ssl
      - ../../.env:/apps/.env
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://${HOST:-0.0.0.0}:${PORT:-3000}/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  test:
    image: docker-test:latest
    build:
      context: ../..
      dockerfile: ./tooling/docker/Dockerfile.test
    volumes:
      # Note: these mounts overlay host source (and its node_modules, built for
      # the host platform) over the image's. For a hermetic run use
      # `make test-docker-*`, which runs the image without mounts.
      - ../../apps/server:/anchormarks/apps/server
      - ../../apps/client:/anchormarks/apps/client
      - ../../.env:/anchormarks/.env
    environment:
      NODE_ENV: test
      DB_PATH: ":memory:"
    profiles:
      - test

networks:
  npm-network:
    external: true
    name: nginxproxymanager_npm-network
